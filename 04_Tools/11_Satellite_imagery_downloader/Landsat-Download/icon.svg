<?xml version="1.0" encoding="UTF-8"?>
<!-- "Landsat Download" icon: a satellite over stripes in the classic
     Landsat band colours, with a download arrow. © Grzegorz Górniak -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- swath stripes (blue / green / red / infrared) -->
  <rect x="4" y="36" width="56" height="6" rx="2" fill="#419bdf"/>
  <rect x="4" y="43" width="56" height="6" rx="2" fill="#4caf50"/>
  <rect x="4" y="50" width="56" height="6" rx="2" fill="#e53935"/>
  <rect x="4" y="57" width="56" height="4" rx="2" fill="#8e24aa"/>
  <!-- satellite body and solar panels -->
  <rect x="26" y="8" width="12" height="10" rx="2" fill="#00bde7"/>
  <rect x="8" y="10" width="16" height="6" rx="1" fill="#007c99"/>
  <rect x="40" y="10" width="16" height="6" rx="1" fill="#007c99"/>
  <!-- download arrow towards the stripes -->
  <polygon points="29,20 35,20 35,26 40,26 32,34 24,26 29,26"
           fill="#ffffff" stroke="#00bde7" stroke-width="2"
           stroke-linejoin="round"/>
</svg>
